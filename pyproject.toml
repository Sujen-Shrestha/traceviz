[project]
name = "traceviz"
version = "0.1.0"
description = "Visual traceroute, route monitor and speed test"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "sqlmodel>=0.0.22",
    "maxminddb>=2.6",
    "httpx>=0.27",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
traceviz = "traceviz.cli.app:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceviz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs real mtr and network access"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.uv]
# Only resolve releases at least two weeks old; bump deliberately when upgrading.
exclude-newer = "2026-09-29T00:00:00Z"
